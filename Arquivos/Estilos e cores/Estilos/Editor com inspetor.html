<!DOCTYPE html>
<!-- Rascunho de estrutura: Editor com inspetor -->
<!-- Trilho de ferramentas à esquerda -> área de trabalho ao centro -> painel de propriedades à direita -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Editor com inspetor</title><style>
/* Paleta de reserva — o Designer troca estas variáveis pela paleta escolhida.
   Elas existem para o arquivo continuar legível aberto sozinho no navegador. */
:root{
  --fundo:#1B1B1B; --superficie:#272727; --superficie-hover:#323232; --superficie-escura:#141414;
  --texto:#E8E8E8; --texto-secundario:#9B9B9B;
  --primaria:#B8B8B8; --positiva:#A0A0A0; --negativa:#7C7C7C; --especial:#8E8E8E; --utilitaria:#6C6C6C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fundo);color:var(--texto);height:100vh;overflow:hidden;
     font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;line-height:1.45}
.rot{color:var(--texto-secundario);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.bt{background:var(--primaria);color:var(--fundo);border:0;border-radius:5px;
    padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer}
.bt.sec{background:transparent;color:var(--utilitaria);border:1px solid var(--utilitaria)}
.bt.neg{background:var(--negativa);color:var(--fundo)}
.bt.pos{background:var(--positiva);color:var(--fundo)}
body{display:flex}
.trilho{width:44px;background:var(--superficie-escura);border-right:1px solid var(--superficie-hover);flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0}
.fer{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--texto-secundario);font-size:13px}
.fer.on{background:var(--primaria);color:var(--fundo)}
.meio{flex:1;min-width:0;display:flex;flex-direction:column}
.mtop{height:32px;background:var(--superficie);border-bottom:1px solid var(--superficie-hover);display:flex;align-items:center;justify-content:space-between;padding:0 11px;flex-shrink:0;font-size:11.5px}
.mesa{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--superficie-escura)}
.peca{width:260px;height:160px;background:var(--superficie);border:2px solid var(--primaria);border-radius:9px;display:flex;flex-direction:column;padding:12px;gap:7px;position:relative}
.alca{position:absolute;width:7px;height:7px;background:var(--primaria);border-radius:1px}
.insp{width:210px;background:var(--superficie);border-left:1px solid var(--superficie-hover);flex-shrink:0;display:flex;flex-direction:column;padding:11px 10px;gap:8px;overflow:auto}
.prop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prop .k{color:var(--texto-secundario);font-size:11px}
.prop .v{background:var(--superficie-hover);border-radius:5px;padding:3px 8px;font-size:11px;min-width:64px;text-align:right}
</style></head><body>
<div class="trilho">
  <div class="fer on">↖</div><div class="fer">▭</div><div class="fer">T</div><div class="fer">◯</div><div class="fer">✎</div>
  <div style="flex:1"></div><div class="fer">⌗</div>
</div>
<div class="meio">
  <div class="mtop"><span>Tela inicial — rascunho 3</span><button class="bt">Publicar</button></div>
  <div class="mesa">
    <div class="peca">
      <span class="alca" style="left:-4px;top:-4px"></span><span class="alca" style="right:-4px;top:-4px"></span>
      <span class="alca" style="left:-4px;bottom:-4px"></span><span class="alca" style="right:-4px;bottom:-4px"></span>
      <div class="rot">Cartão selecionado</div>
      <div style="font-size:14px;font-weight:700">Título do bloco</div>
      <div style="color:var(--texto-secundario)">Texto de apoio dentro da peça em edição.</div>
      <div style="margin-top:auto"><button class="bt">Ação</button></div>
    </div>
  </div>
</div>
<div class="insp">
  <div class="rot">Propriedades</div>
  <div class="prop"><span class="k">Largura</span><span class="v">260 px</span></div>
  <div class="prop"><span class="k">Altura</span><span class="v">160 px</span></div>
  <div class="prop"><span class="k">Raio</span><span class="v">9 px</span></div>
  <div class="prop"><span class="k">Preenchimento</span><span class="v" style="color:var(--primaria)">primária</span></div>
  <div class="rot" style="margin-top:5px">Camadas</div>
  <div class="prop"><span class="k">Cartão</span><span class="v">visível</span></div>
  <div class="prop"><span class="k">Fundo</span><span class="v">travado</span></div>
</div>
</body></html>
